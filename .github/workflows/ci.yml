name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint + type + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Core supports 3.10+ (pyproject requires-python = ">=3.10,<4.0").
        # 3.14 is the floor where langchain-core's asyncio.iscoroutinefunction
        # deprecation surfaces in tests; pinning across the matrix catches
        # version-specific regressions.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with dev extras
        # --no-deps is NOT used here: CI must resolve the real transitive
        # graph (langchain, langgraph) to catch version drift.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        # Project convention: lint-only. `ruff format --check` is not run
        # because pre-existing files were never formatted; new code may be.
        run: python -m ruff check src/langcompress/ tests/

      - name: Mypy (type-check)
        # strict config in pyproject.toml [tool.mypy]; tests are excluded
        # (they use langchain fixtures without full typing).
        run: python -m mypy src/langcompress/

      - name: Pytest
        # asyncio_mode = auto is set in pyproject; no marker flag needed.
        # A test needing a real provider skips itself on missing env var.
        run: python -m pytest -q

      - name: Version sanity
        # __version__ must match pyproject so a release wheel cannot ship a
        # stale number.
        run: |
          python - <<'PY'
          import importlib.metadata as m
          import langcompress
          assert langcompress.__version__ == m.version("langcompress"), \
              f"version mismatch: __version__={langcompress.__version__} dist={m.version('langcompress')}"
          print(langcompress.__version__)
          PY
